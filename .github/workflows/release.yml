name: Android Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Test and build release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Sign release APK
        id: sign
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          unsigned_apk="$(find app/build/outputs/apk/release -name '*-release-unsigned.apk' -print -quit)"
          if [ -z "$unsigned_apk" ]; then
            echo "Unsigned release APK was not generated" >&2
            exit 1
          fi

          mkdir -p release-artifacts
          keystore="$RUNNER_TEMP/yingjian-release.jks"
          aligned_apk="$RUNNER_TEMP/YingJian-${GITHUB_REF_NAME}-aligned.apk"
          signed_apk="$PWD/release-artifacts/YingJian-${GITHUB_REF_NAME}-release.apk"

          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keystore"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$signed_apk"
          echo "signed_apk=$signed_apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YingJian ${{ github.ref_name }}
          files: ${{ steps.sign.outputs.signed_apk }}
          generate_release_notes: true
